<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vidPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="vidFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0D0D0"/>
      <stop offset="100%" stop-color="#B8B8B8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <filter id="vidShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>
  <!-- Page body -->
  <path d="M112 40 L336 40 L400 104 L400 464 Q400 472 392 472 L120 472 Q112 472 112 464 Z" fill="url(#vidPaper)" filter="url(#vidShadow)"/>
  <!-- Corner fold -->
  <path d="M336 40 L336 96 Q336 104 344 104 L400 104 Z" fill="url(#vidFold)"/>
  <!-- Video preview area -->
  <rect x="152" y="160" width="208" height="140" rx="8" fill="url(#screen)"/>
  <!-- Play button circle -->
  <circle cx="256" cy="230" r="32" fill="rgba(255,255,255,0.2)"/>
  <!-- Play triangle -->
  <path d="M244 210 L244 250 L274 230 Z" fill="rgba(255,255,255,0.9)"/>
  <!-- Film strip details -->
  <rect x="152" y="160" width="208" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="152" y="296" width="208" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <!-- Bottom line placeholder -->
  <rect x="152" y="324" width="140" height="8" rx="4" fill="#D4D4D4"/>
  <rect x="152" y="348" width="100" height="8" rx="4" fill="#D4D4D4"/>
</svg>
