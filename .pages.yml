media: media
content:
  - name: site
    label: Site Settings
    type: file
    path: settings/site.md
    fields:
      - name: title
        label: Site Title
        type: string
        description: "Displayed in the browser tab"
      - name: description
        label: Site Description
        type: string
        description: "Meta description for SEO"
      - name: wallpaper
        label: Desktop Wallpaper
        type: image
        description: "Background image for the desktop. Leave empty for default gradient."
      - name: icon_text
        label: Text File Icon
        type: image
        description: "Custom icon for text files. Leave empty for default."
      - name: icon_image
        label: Image File Icon
        type: image
        description: "Custom icon for image files. Leave empty for default."
      - name: icon_video
        label: Video File Icon
        type: image
        description: "Custom icon for video files. Leave empty for default."
      - name: icon_folder
        label: Folder Icon
        type: image
        description: "Custom icon for folders. Leave empty for default."

  - name: dock
    label: Dock Shortcuts
    type: collection
    path: dock
    fields:
      - name: title
        label: Tooltip Label
        type: string
      - name: icon
        label: Dock Icon
        type: image
        description: "Icon image displayed in the dock"
      - name: url
        label: URL
        type: string
        description: "External link (e.g. https://github.com/you). Leave empty to open an entry."
      - name: entry_id
        label: Entry ID
        type: string
        description: "Open a desktop file or folder (e.g. 'about' or 'sample-project'). Ignored if URL is set."
      - name: order
        label: Sort Order
        type: number
        description: "Lower numbers appear first in the dock"

  - name: desktop-files
    label: Desktop Files
    type: collection
    path: docs
    fields:
      - name: title
        type: string
      - name: type
        label: Content Type
        type: select
        options:
          - text
          - image
          - video
        description: "text = markdown document · image = image viewer · video = embedded or uploaded video"
      - name: icon
        label: Custom Icon
        type: image
      - name: thumbnail
        label: Thumbnail
        type: image
      - name: video_url
        label: Video URL
        type: string
        description: "Vimeo, YouTube, or any embeddable video URL"
      - name: video
        label: Video File
        type: image
        description: "Upload a video file (mp4, webm, mov). Used when no Video URL is set."
      - name: image
        label: Image
        type: image
      - name: body
        type: rich-text

  - name: projects
    label: Create New Project
    type: collection
    path: _projects
    fields:
      - name: title
        label: Project Title
        type: string
        description: "Name of the project (becomes a folder on the desktop)"
      - name: icon
        label: Custom Folder Icon
        type: image
        description: "Custom icon for this project folder. Leave empty for default folder icon."

  - name: "project-2026-05-18-test2"
    label: "Project: test2"
    type: collection
    path: docs/2026-05-18-test2
    fields:
      - name: title
        type: string
      - name: type
        label: Content Type
        type: select
        options:
          - text
          - image
          - video
          - folder
        description: "text = markdown document · image = image viewer · video = embedded or uploaded video · folder = subfolder (only for _index.md)"
      - name: icon
        label: Custom Icon
        type: image
      - name: thumbnail
        label: Thumbnail
        type: image
      - name: video_url
        label: Video URL
        type: string
        description: "Vimeo, YouTube, or any embeddable video URL"
      - name: video
        label: Video File
        type: image
        description: "Upload a video file (mp4, webm, mov). Used when no Video URL is set."
      - name: image
        label: Image
        type: image
      - name: body
        type: rich-text

  - name: "project-sample-project"
    label: "Project: Sample Project"
    type: collection
    path: docs/sample-project
    fields:
      - name: title
        type: string
      - name: type
        label: Content Type
        type: select
        options:
          - text
          - image
          - video
          - folder
        description: "text = markdown document · image = image viewer · video = embedded or uploaded video · folder = subfolder (only for _index.md)"
      - name: icon
        label: Custom Icon
        type: image
      - name: thumbnail
        label: Thumbnail
        type: image
      - name: video_url
        label: Video URL
        type: string
        description: "Vimeo, YouTube, or any embeddable video URL"
      - name: video
        label: Video File
        type: image
        description: "Upload a video file (mp4, webm, mov). Used when no Video URL is set."
      - name: image
        label: Image
        type: image
      - name: body
        type: rich-text
